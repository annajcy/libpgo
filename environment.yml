name: libpgo
channels:
  - conda-forge
dependencies:
  - python=3.12

  # --- build tools ---
  - cmake>=3.29
  - ninja
  - pkg-config

  # --- math / precision libraries (replaces apt libgmp-dev/libmpfr-dev/libimath-dev and brew gmp/mpfr/imath) ---
  - gmp
  - mpfr
  - imath
  - libblas
  - liblapack
  - zlib

  # --- C++ dependencies ---
  - libboost-devel
  - tbb-devel

  # --- meshing & geometry ---
  - gmsh
  - openvdb

  # --- MKL (Linux / Windows only — CMake auto-disables on macOS / Apple Silicon) ---
  # - mkl-devel

  # --- Python: core (conda) ---
  - numpy        # kept on conda — openvdb's python bindings hard-depend on conda-numpy
  - pip
  - setuptools
  - wheel

  # --- Python: package runtime + optional deps (declared in setup.py) ---
  # Native build deps (gmp, tbb, openvdb, gmsh, numpy, ...) stay on conda above.
  # The package's own Python deps live once in setup.py (install_requires +
  # extras) and are installed by the editable build step. They are intentionally
  # NOT placed in a `pip:` section here: that step must keep --no-build-isolation,
  # and pip requirement files cannot carry that flag.
  #     pip install -e .[viz,torch,dev] --no-build-isolation
  # Why pip rather than conda for some of them:
  #   torch -> official pip wheel provides macOS arm64 MPS (was conda `pytorch`)
  #   viz   -> pyvista pulls its own vtk wheel (conda vtk-base removed to avoid a
  #            duplicate vtkmodules import path); the trame stack lags on conda-forge
