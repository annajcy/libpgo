name: libpgo
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12

  # --- build tools ---
  - cmake>=3.29
  - ninja
  - pkg-config

  # --- math / precision libraries (replaces apt libgmp-dev/libmpfr-dev/libimath-dev and brew gmp/mpfr/imath) ---
  - gmp
  - mpfr
  - imath
  # BLAS/LAPACK — OpenBLAS stack, pinned to the *openblas variant so numpy/scipy
  # use the SAME backend as the C++ build (which forces BLA_VENDOR=OpenBLAS).
  # Without the pin the interface could drift to a different backend, leaving
  # numpy on one BLAS and the extension on another (two BLAS in one process).
  # `openblas` is the build-time dev package — unversioned libopenblas.dylib +
  # pkgconfig/openblas.pc + headers that find_package(BLAS) needs; it pulls the
  # libopenblas runtime in automatically.
  # For an MKL dev build, flip the whole stack to *mkl instead — see the README.
  - libblas=*=*openblas
  - liblapack=*=*openblas
  - openblas
  - zlib

  # --- C++ dependencies ---
  # Ceres 2.2 accepts Eigen 3.x; conda-forge Eigen 5.x has an incompatible
  # package config for Ceres' `find_package(Eigen3 3.3)`.
  - eigen>=3.4,<4
  - libboost-devel
  - tbb-devel

  # --- meshing & geometry ---
  - gmsh
  - openvdb

  # --- MKL (Linux / Windows only — CMake auto-disables on macOS / Apple Silicon) ---
  # - mkl-devel

  # --- Python: core (conda) ---
  - numpy        # kept on conda — openvdb's python bindings hard-depend on conda-numpy
  - pip
  - setuptools
  - wheel

  # --- Python: package runtime + optional deps (declared in setup.py) ---
  # Native build deps (gmp, tbb, openvdb, gmsh, numpy, ...) stay on conda above.
  # The package's own Python deps live once in setup.py (install_requires +
  # extras) and are installed by the editable build step. They are intentionally
  # NOT placed in a `pip:` section here: that step must keep --no-build-isolation,
  # and pip requirement files cannot carry that flag.
  #     pip install -e .[viz,torch,dev] --no-build-isolation
  # Why pip rather than conda for some of them:
  #   torch -> official pip wheel provides macOS arm64 MPS (was conda `pytorch`)
  #   viz   -> pyvista pulls its own vtk wheel (conda vtk-base removed to avoid a
  #            duplicate vtkmodules import path); the trame stack lags on conda-forge
