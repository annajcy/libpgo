name: libpgo
channels:
  - conda-forge
dependencies:
  - python=3.12

  # --- build tools ---
  - cmake>=3.29
  - ninja
  - pkg-config

  # --- math / precision libraries (replaces apt libgmp-dev/libmpfr-dev/libimath-dev and brew gmp/mpfr/imath) ---
  - gmp
  - mpfr
  - imath
  - libblas
  - liblapack
  - zlib

  # --- C++ dependencies ---
  - libboost-devel
  - tbb-devel

  # --- meshing & geometry ---
  - gmsh
  - openvdb

  # --- MKL (Linux / Windows only — CMake auto-disables on macOS / Apple Silicon) ---
  # - mkl-devel

  # --- Python: core (conda) ---
  - numpy        # kept on conda — openvdb's python bindings hard-depend on conda-numpy
  - pip
  - setuptools
  - wheel

  # --- Python: pip-managed (pip-first / moved off conda) ---
  # Native build deps (gmp, tbb, openvdb, gmsh, numpy, ...) stay on conda above.
  - pip:
      - torch         # was conda `pytorch`; official pip wheel (MPS) on macOS arm64
      - pyvista       # pulls its own vtk wheel; conda vtk-base removed to avoid collision
      - pytest
      - notebook
      - trame
      - trame-vtk
      - trame-vuetify
