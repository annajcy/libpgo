[build-system]
requires = [
    "setuptools>=42",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# Guard against hangs: a non-terminating solve is killed after this many seconds
# instead of burning the whole 120-min job timeout, and the dumped traceback
# pinpoints the stuck case.
# The `thread` method reliably kills a hang stuck in native (C++) code, unlike the
# signal method which can't interrupt a GIL-holding call. Long-running Python
# integration tests use the same project-wide timeout.
timeout = 600
timeout_method = "thread"
