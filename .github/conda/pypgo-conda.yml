name: pypgo-conda
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - cmake>=3.29
  - ninja
  - pkg-config
  - gmp
  - mpfr
  - imath
  - libblas=*=*openblas
  - liblapack=*=*openblas
  - openblas
  - zlib
  - eigen>=3.4,<4
  - libboost-devel
  - tbb-devel
  - gmsh
  - openvdb
  - numpy
  - pip
  - setuptools
  - wheel
