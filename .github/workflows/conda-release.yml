name: Conda Release

on:
  push:
    branches:
      - main
      - master
      - original/*
      - codex/*
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      upload:
        description: Upload built packages to Anaconda.org
        required: true
        type: boolean
        default: false
      label:
        description: Anaconda.org label to upload to
        required: true
        type: string
        default: main

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact_name: linux-64-pypgo
            package_name: pypgo
            preset: pypgo-conda
            with_mkl: "0"
          - os: ubuntu-24.04
            artifact_name: linux-64-pypgo-mkl
            package_name: pypgo-mkl
            preset: pypgo-conda-mkl
            with_mkl: "1"
            # The MKL build is the heaviest target: even at parallelism 2 two heavy
            # translation units together exceed the 16 GB runner and it OOMs (froze
            # mid-build, then "lost communication"). Serialize compiles so peak memory
            # is a single TU; the added swap below cushions any oversized one.
            cmake_parallel: "1"
          - os: macos-15
            artifact_name: osx-arm64-pypgo
            package_name: pypgo
            preset: pypgo-conda
            with_mkl: "0"
          - os: windows-2022
            artifact_name: win-64-pypgo
            package_name: pypgo
            preset: pypgo-conda
            with_mkl: "0"
          - os: windows-2022
            artifact_name: win-64-pypgo-mkl
            package_name: pypgo-mkl
            preset: pypgo-conda-mkl
            with_mkl: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free up disk space and add swap (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "=== disk/memory before cleanup ==="
          df -h /
          free -m
          # Remove large preinstalled toolchains we don't use, to give the heavy
          # MKL build headroom. Only the MKL Linux job is tight, but this is harmless
          # for the non-MKL job too.
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/share/swift || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          # Add swap so an oversized compile can spill instead of OOM-killing the
          # runner (the runner ships only ~3 GB swap on 16 GB RAM). Use a
          # dedicated file instead of /swapfile, which may already be active.
          swapfile="${RUNNER_TEMP:-/tmp}/pypgo-swapfile"
          sudo rm -f "${swapfile}"
          sudo dd if=/dev/zero of="${swapfile}" bs=1M count=8192 status=none
          sudo chmod 600 "${swapfile}"
          sudo mkswap "${swapfile}" >/dev/null
          sudo swapon "${swapfile}"
          echo "=== disk/memory after cleanup ==="
          df -h /
          free -m

      - name: Check release tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import pathlib
          import re
          import sys

          setup_py = pathlib.Path("setup.py").read_text()
          match = re.search(r'version="([^"]+)"', setup_py)
          if not match:
              raise SystemExit("Could not find setup.py version.")
          setup_version = match.group(1)
          tag_version = "${{ github.ref_name }}".removeprefix("v")
          if tag_version != setup_version:
              raise SystemExit(
                  f"Release tag v{tag_version} does not match setup.py version {setup_version}."
              )

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: true
          auto-update-conda: false
          activate-environment: conda-build-env
          python-version: "3.12"

      - name: Install conda build tools
        if: runner.os != 'Windows'
        shell: bash -l {0}
        run: |
          conda install -y conda-build conda-index anaconda-client

      - name: Install conda build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: conda install -y conda-build conda-index anaconda-client

      - name: Build conda package
        if: runner.os != 'Windows'
        shell: bash -l {0}
        env:
          PYPGO_CONDA_PACKAGE: ${{ matrix.package_name }}
          PYPGO_CMAKE_PRESET: ${{ matrix.preset }}
          PYPGO_WITH_MKL: ${{ matrix.with_mkl }}
          # Empty for non-MKL jobs → recipe falls back to CPU_COUNT.
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.cmake_parallel }}
        run: |
          conda-build conda-recipe \
            --output-folder conda-bld \
            --no-anaconda-upload

      - name: Build conda package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PYPGO_CONDA_PACKAGE: ${{ matrix.package_name }}
          PYPGO_CMAKE_PRESET: ${{ matrix.preset }}
          PYPGO_WITH_MKL: ${{ matrix.with_mkl }}
          # Empty for the Windows jobs → recipe falls back to CPU_COUNT.
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.cmake_parallel }}
        run: |
          conda-build conda-recipe `
            --output-folder conda-bld `
            --no-anaconda-upload

      - name: Create local conda channel
        if: runner.os != 'Windows'
        shell: bash -l {0}
        run: |
          rm -rf local-channel
          mkdir -p local-channel/noarch
          subdir="$(find conda-bld -mindepth 1 -maxdepth 1 -type d \
            \( -name 'linux-64' -o -name 'osx-arm64' -o -name 'win-64' \) \
            -exec basename {} \; | head -n 1)"
          test -n "${subdir}"
          mkdir -p "local-channel/${subdir}"
          find "conda-bld/${subdir}" -maxdepth 1 -type f \( -name '*.conda' -o -name '*.tar.bz2' \) \
            -exec cp {} "local-channel/${subdir}/" \;
          python -m conda_index local-channel
          python -m zipfile -c "${{ matrix.artifact_name }}-channel.zip" local-channel

      - name: Create local conda channel
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item local-channel -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path local-channel\noarch -Force | Out-Null
          $subdir = Get-ChildItem conda-bld -Directory |
            Where-Object { $_.Name -in @("linux-64", "osx-arm64", "win-64") } |
            Select-Object -First 1 -ExpandProperty Name
          if (-not $subdir) {
            throw "Could not find conda build subdir."
          }
          New-Item -ItemType Directory -Path "local-channel\$subdir" -Force | Out-Null
          Get-ChildItem -Path "conda-bld\$subdir\*.conda", "conda-bld\$subdir\*.tar.bz2" -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination "local-channel\$subdir"
          python -m conda_index local-channel
          python -m zipfile -c "${{ matrix.artifact_name }}-channel.zip" local-channel

      - name: Upload conda build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            conda-bld/**/*.conda
            conda-bld/**/*.tar.bz2
          if-no-files-found: error

      - name: Upload local conda channel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-channel
          path: ${{ matrix.artifact_name }}-channel.zip
          if-no-files-found: error

  upload:
    name: Upload to Anaconda.org
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.upload)
    steps:
      - name: Download conda artifacts
        uses: actions/download-artifact@v4
        with:
          path: conda-artifacts
          merge-multiple: true

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: true
          auto-update-conda: false
          activate-environment: conda-upload-env
          python-version: "3.12"

      - name: Upload packages
        shell: bash -l {0}
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
          ANACONDA_USER: ${{ vars.ANACONDA_USER }}
          ANACONDA_LABEL: ${{ github.event.inputs.label || 'main' }}
        run: |
          test -n "${ANACONDA_API_TOKEN}"
          test -n "${ANACONDA_USER}"
          conda install -y anaconda-client
          find conda-artifacts -type f \( -name '*.conda' -o -name '*.tar.bz2' \) \
            ! -path '*/local-channel/*' -print0 \
            | xargs -0 anaconda -t "${ANACONDA_API_TOKEN}" upload \
                --user "${ANACONDA_USER}" \
                --label "${ANACONDA_LABEL}"
