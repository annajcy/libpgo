name: Linux CI

on:
  push:
    branches:
      - main
      - master
      - original/*
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  python-build-and-test:
    name: Python Build and Test
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install compiler and headless rendering support
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libegl1 libgl1-mesa-glx

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: libpgo
          auto-activate-base: false
          use-mamba: true
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: true

      - name: Build and install Python package
        run: python -m pip install -e . --no-build-isolation

      - name: Run Python API pytest suite
        run: python -m pytest -q tests/pypgo

      - name: Execute example notebooks
        env:
          PYVISTA_OFF_SCREEN: "True"
          RUN_NOTEBOOKS: "1"
        run: python -m pytest tests/pypgo/test_notebook.py -v -k "TestNotebookExecution"

  cmake-build:
    name: CMake Preset Build and Test
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    defaults:
      run:
        shell: bash -l {0}

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: libpgo
          auto-activate-base: false
          use-mamba: true
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: true

      - name: Install MKL
        run: mamba install -y mkl-devel

      - name: Configure with preset base
        run: cmake --preset base

      - name: Build with preset base
        run: cmake --build --preset base

      - name: Run CTest
        run: ctest --test-dir build/base --output-on-failure
