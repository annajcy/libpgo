name: Linux CI

on:
  push:
    branches:
      - main
      - master
      - original/*
      - codex/*
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  python-build-and-test:
    name: Python Build and Test (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: openblas
            label: OpenBLAS
            environment_file: environment.yml
            conda_env: libpgo
            cmake_preset: pypgo-ci
            cmake_parallel: "3"
            wheel_package: pypgo
            wheel_dist: pypgo
          - variant: mkl
            label: MKL
            environment_file: environment-mkl.yml
            conda_env: libpgo-mkl
            cmake_preset: pypgo-mkl-ci
            # Match the conda-release MKL lane: a single heavy translation unit
            # at a time fits the hosted runner more reliably than parallel TUs.
            cmake_parallel: "1"
            wheel_package: pypgo-mkl
            wheel_dist: pypgo_mkl

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install compiler and headless rendering support
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libegl1 libgl1 patchelf

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          environment-file: ${{ matrix.environment_file }}
          activate-environment: ${{ matrix.conda_env }}
          auto-activate-base: false
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: true

      - name: Select pthreads OpenBLAS for PyPI wheel
        if: matrix.wheel_package == 'pypgo'
        run: |
          conda install -y \
            "libblas=*=*openblas" \
            "liblapack=*=*openblas" \
            "openblas=*=*pthreads*" \
            "libopenblas=*=*pthreads*"

      - name: Build Python wheel
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.cmake_parallel }}
          # Build the wheel with the preset that ships as a conda package (native
          # opt off) instead of the default `pypgo` preset (-march=native).
          PYPGO_CMAKE_PRESET: ${{ matrix.cmake_preset }}
          PYPGO_PACKAGE_NAME: ${{ matrix.wheel_package }}
          PYPGO_WHEEL_DIST: ${{ matrix.wheel_dist }}
        run: |
          shopt -s nullglob
          rm -rf dist
          python -m pip wheel . --no-build-isolation --no-deps --wheel-dir dist
          wheel=(dist/${PYPGO_WHEEL_DIST}-*.whl)
          if (( ${#wheel[@]} != 1 )); then
            printf 'Expected exactly one %s wheel, found %s.\n' "${PYPGO_WHEEL_DIST}" "${#wheel[@]}"
            printf '%s\n' "${wheel[@]}"
            exit 1
          fi

      - name: Repair Python wheel
        env:
          PYPGO_CMAKE_PRESET: ${{ matrix.cmake_preset }}
          PYPGO_WHEEL_PACKAGE: ${{ matrix.wheel_package }}
          PYPGO_WHEEL_DIST: ${{ matrix.wheel_dist }}
        run: |
          shopt -s nullglob
          export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/build/${PYPGO_CMAKE_PRESET}/lib:${CONDA_PREFIX}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          python -m pip install auditwheel
          rm -rf wheelhouse
          repair_args=(-w wheelhouse)
          if [[ "${PYPGO_WHEEL_PACKAGE}" == "pypgo-mkl" ]]; then
            repair_args+=(
              --exclude 'libopenblas*.so*'
              --exclude 'libblas*.so*'
              --exclude 'liblapack*.so*'
              --exclude 'libmkl*.so*'
              --exclude 'libiomp*.so*'
              --exclude 'libomp*.so*'
              --exclude 'libgomp*.so*'
            )
          fi
          python -m auditwheel repair "${repair_args[@]}" dist/${PYPGO_WHEEL_DIST}-*.whl
          python -m auditwheel show wheelhouse/${PYPGO_WHEEL_DIST}-*.whl
          wheel=(wheelhouse/${PYPGO_WHEEL_DIST}-*.whl)
          if (( ${#wheel[@]} != 1 )); then
            printf 'Expected exactly one repaired %s wheel, found %s.\n' "${PYPGO_WHEEL_DIST}" "${#wheel[@]}"
            printf '%s\n' "${wheel[@]}"
            exit 1
          fi
          python - "${wheel[0]}" "${PYPGO_WHEEL_PACKAGE}" <<'PY'
          import sys
          import zipfile

          wheel_package = sys.argv[2]
          with zipfile.ZipFile(sys.argv[1]) as archive:
              names = [name.lower() for name in archive.namelist() if ".libs/" in name]
          print("Vendored shared libraries:")
          for name in names:
              print(f"  {name}")
          if wheel_package == "pypgo-mkl":
              forbidden = (
                  "libopenblas",
                  "libblas",
                  "liblapack",
                  "libmkl",
                  "libiomp",
                  "libomp",
                  "libgomp",
              )
              vendored = [
                  name
                  for name in names
                  if any(token in name for token in forbidden)
              ]
              if vendored:
                  print("Repaired pypgo-mkl wheel unexpectedly vendors BLAS/MKL/OpenMP runtime libraries:")
                  for name in vendored:
                      print(f"  {name}")
                  raise SystemExit(1)
              print("OK: pypgo-mkl wheel relies on the conda-provided BLAS/MKL/OpenMP runtime.")
          else:
              openblas = [name for name in names if "openblas" in name]
              if not openblas:
                  print("Repaired pypgo wheel did not vendor OpenBLAS:")
                  for name in names:
                      print(f"  {name}")
                  raise SystemExit(1)
              openmp = [
                  name
                  for name in names
                  if any(token in name for token in ("libgomp", "libomp", "libiomp"))
              ]
              if openmp:
                  print("Repaired pypgo wheel unexpectedly vendors an OpenMP runtime:")
                  for name in openmp:
                      print(f"  {name}")
                  raise SystemExit(1)
              print("OK: pypgo wheel vendors an OpenBLAS runtime.")
          PY

      - name: Upload Python wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: pypgo-wheel-linux-${{ matrix.variant }}
          path: wheelhouse/${{ matrix.wheel_dist }}-*.whl
          if-no-files-found: error

      - name: Verify repaired wheel in minimal environment
        env:
          PYPGO_WHEEL_DIST: ${{ matrix.wheel_dist }}
          PYPGO_WHEEL_PACKAGE: ${{ matrix.wheel_package }}
        run: |
          shopt -s nullglob
          clean_env="${RUNNER_TEMP}/pypgo-wheel-${{ matrix.variant }}"
          if [[ "${PYPGO_WHEEL_PACKAGE}" == "pypgo-mkl" ]]; then
            conda create -y -p "${clean_env}" python=3.12 pip numpy "libblas=*=*mkl" "liblapack=*=*mkl" mkl-devel
            conda run -p "${clean_env}" python -m pip install --no-deps "${GITHUB_WORKSPACE}"/wheelhouse/${PYPGO_WHEEL_DIST}-*.whl
            run_python=(conda run -p "${clean_env}" python)
          else
            python -m venv "${clean_env}"
            "${clean_env}/bin/python" -m pip install --upgrade pip
            "${clean_env}/bin/python" -m pip install "${GITHUB_WORKSPACE}"/wheelhouse/${PYPGO_WHEEL_DIST}-*.whl
            run_python=("${clean_env}/bin/python")
          fi
          tmpdir="$(mktemp -d)"
          cd "${tmpdir}"
          "${run_python[@]}" -X faulthandler - <<'PY'
          from pathlib import Path
          import importlib
          import os

          if os.environ["PYPGO_WHEEL_PACKAGE"] == "pypgo":
              import numpy as np
              print(f"numpy {np.__version__} from {Path(np.__file__).resolve()}", flush=True)

          for module_name in (
              "pypgo",
              "pypgo._core",
              "pypgo.energy",
              "pypgo.mesh",
              "pypgo.solver",
          ):
              print(f"import {module_name}", flush=True)
              importlib.import_module(module_name)

          import pypgo
          import pypgo._core as core
          package_file = Path(pypgo.__file__).resolve()
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          assert workspace not in package_file.parents, package_file
          info = core.build_info()
          assert info["module"] == "pypgo._core"
          print(f"pypgo wheel import OK from {package_file}")
          PY
          "${run_python[@]}" -X faulthandler "${GITHUB_WORKSPACE}/tests/conda_smoke_test.py"

  cmake-build:
    name: CMake Preset Build and Test (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: OpenBLAS
            environment_file: environment.yml
            conda_env: libpgo
            cmake_parallel: "3"
            cmake_configure_args: -DPGO_USE_MKL=OFF
          - label: MKL
            environment_file: environment-mkl.yml
            conda_env: libpgo-mkl
            # Match the conda-release MKL lane: a single heavy translation unit
            # at a time fits the hosted runner more reliably than parallel TUs.
            cmake_parallel: "1"
            cmake_configure_args: ""

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install compiler and headless rendering support
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libegl1 libgl1

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          environment-file: ${{ matrix.environment_file }}
          activate-environment: ${{ matrix.conda_env }}
          auto-activate-base: false
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: true

      - name: Configure with preset base
        run: cmake --preset base ${{ matrix.cmake_configure_args }}

      - name: Build with preset base
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.cmake_parallel }}
        run: cmake --build --preset base

      - name: Run CTest
        run: ctest --test-dir build/base --output-on-failure

      - name: Install Python test dependencies
        run: |
          python -m pip install --no-cache-dir pytest pytest-timeout pyvista trame trame-vtk trame-vuetify
          python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run Python API pytest suite
        env:
          PYVISTA_OFF_SCREEN: "True"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          while IFS= read -r -d '' test_file; do
            case "$(basename "${test_file}")" in
              test_example_notebooks.py|test_notebook.py)
                continue
                ;;
            esac
            python -m pytest -q "${test_file}"
          done < <(find tests/pypgo -maxdepth 1 -name 'test_*.py' -print0 | sort -z)
