name: Linux CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MKL_THREADING_LAYER: TBB
  CMAKE_BUILD_PARALLEL_LEVEL: "3"
  PYPGO_CMAKE_PRESET: base-ci
  PYPGO_WHEEL_DIST: pypgo

jobs:
  build-test-wheel:
    name: Build, Test, and Package
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system build tools and headless rendering support
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libegl1 libgl1 patchelf

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: libpgo
          auto-activate-base: false
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: true

      - name: Install and verify MKL-TBB
        run: |
          conda install -y "libblas=*=*mkl" "liblapack=*=*mkl" mkl-devel
          python tests/check_mkl_tbb_runtime.py

      - name: Configure and build
        run: |
          cmake --preset base-ci
          cmake --build --preset base-ci

      - name: Run native tests
        run: ctest --test-dir build/base-ci --output-on-failure

      - name: Install Python test dependencies
        run: |
          python -m pip install --no-cache-dir pytest pytest-timeout pyvista trame trame-vtk trame-vuetify
          python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run Python API tests
        env:
          PYVISTA_OFF_SCREEN: "True"
        run: >-
          python -m pytest -q tests/pypgo
          --ignore=tests/pypgo/test_example_notebooks.py
          --ignore=tests/pypgo/test_notebook.py

      - name: Build wheel from the tested build tree
        run: |
          rm -rf dist
          python -m pip wheel . --no-build-isolation --no-deps --wheel-dir dist

      - name: Repair and audit wheel
        run: |
          export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/build/${PYPGO_CMAKE_PRESET}/lib:${CONDA_PREFIX}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          python -m pip install auditwheel
          rm -rf wheelhouse
          python -m auditwheel repair \
            -w wheelhouse \
            --exclude 'libblas*.so*' \
            --exclude 'liblapack*.so*' \
            --exclude 'libmkl*.so*' \
            dist/${PYPGO_WHEEL_DIST}-*.whl
          python -m auditwheel show wheelhouse/${PYPGO_WHEEL_DIST}-*.whl
          python tests/check_wheel_vendoring.py \
            --provider mkl wheelhouse/${PYPGO_WHEEL_DIST}-*.whl

      - name: Verify wheel in a clean environment
        run: |
          clean_env="${RUNNER_TEMP}/pypgo-wheel-mkl"
          conda create -y -p "${clean_env}" -c conda-forge --strict-channel-priority \
            python=3.12 pip numpy "libblas=*=*mkl" "liblapack=*=*mkl" mkl-devel
          conda run -p "${clean_env}" python -m pip install --no-deps \
            "${GITHUB_WORKSPACE}"/wheelhouse/${PYPGO_WHEEL_DIST}-*.whl
          conda run -p "${clean_env}" python \
            "${GITHUB_WORKSPACE}/tests/check_mkl_tbb_runtime.py" --import-pypgo
          tmpdir="$(mktemp -d)"
          cd "${tmpdir}"
          conda run -p "${clean_env}" python -X faulthandler \
            "${GITHUB_WORKSPACE}/tests/check_installed_wheel.py"
          conda run -p "${clean_env}" python -X faulthandler \
            "${GITHUB_WORKSPACE}/tests/conda_smoke_test.py"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: pypgo-wheel-linux-mkl
          path: wheelhouse/pypgo-*.whl
          if-no-files-found: error
