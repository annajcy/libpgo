name: macOS CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYPGO_WHEEL_DIST: pypgo

jobs:
  build-test-wheel:
    name: MacOS - Build, Test, and Package
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system build tools
        run: brew install cmake ninja pkg-config

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: libpgo
          auto-activate-base: false
          channels: conda-forge
          channel-priority: strict

      - name: Install and verify Accelerate BLAS
        run: |
          conda install -y \
            "libblas=*=*_newaccelerate" \
            "libcblas=*=*_newaccelerate" \
            "liblapack=*=*_newaccelerate" \
            "liblapacke=*=*_newaccelerate"
          python tests/check_accelerate_runtime.py

      - name: Configure and build
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "3"
        run: |
          cmake --preset base-ci
          cmake --build --preset base-ci

      - name: Generate test volume assets
        run: |
          python examples/assets/generate_veg_assets.py \
            --assets box \
            --cubic-resolution 4 \
            --tet-backend tetgen \
            --tet-target-elements 100 \
            --static-dragon-target-elements 0

      - name: Run native tests
        run: ctest --test-dir build/base-ci --output-on-failure

      - name: Install Python test dependencies
        run: python -m pip install --no-cache-dir pytest pytest-timeout pyvista trame trame-vtk trame-vuetify torch

      - name: Run Python API tests
        env:
          PYVISTA_OFF_SCREEN: "True"
        run: >-
          python -m pytest -q tests/pypgo
          --ignore=tests/pypgo/test_example_notebooks.py
          --ignore=tests/pypgo/test_notebook.py

      - name: Build wheel from the tested build tree
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "3"
          PYPGO_CMAKE_PRESET: base-ci
        run: |
          rm -rf dist
          python -m pip wheel . --no-build-isolation --no-deps --wheel-dir dist
          python tests/check_macos_accelerate_linkage.py pypgo/_core*.so

      - name: Repair and audit wheel
        run: |
          export DYLD_LIBRARY_PATH="${GITHUB_WORKSPACE}/build/base-ci/lib:${CONDA_PREFIX}/lib${DYLD_LIBRARY_PATH:+:${DYLD_LIBRARY_PATH}}"
          python -m pip install delocate
          rm -rf wheelhouse
          delocate-wheel -v -w wheelhouse \
            -e libblas \
            -e liblapack \
            dist/${PYPGO_WHEEL_DIST}-*.whl
          delocate-listdeps --all wheelhouse/${PYPGO_WHEEL_DIST}-*.whl
          python tests/check_wheel_vendoring.py \
            --provider accelerate wheelhouse/${PYPGO_WHEEL_DIST}-*.whl

      - name: Verify wheel in a clean environment
        run: |
          clean_env="${RUNNER_TEMP}/pypgo-wheel-accelerate"
          conda create -y -p "${clean_env}" -c conda-forge --strict-channel-priority \
            python=3.12 pip numpy \
            "libblas=*=*_newaccelerate" \
            "libcblas=*=*_newaccelerate" \
            "liblapack=*=*_newaccelerate" \
            "liblapacke=*=*_newaccelerate"
          conda run -p "${clean_env}" python -m pip install --no-deps \
            "${GITHUB_WORKSPACE}"/wheelhouse/${PYPGO_WHEEL_DIST}-*.whl
          conda run -p "${clean_env}" python \
            "${GITHUB_WORKSPACE}/tests/check_accelerate_runtime.py" --import-pypgo
          installed_core="$(conda run -p "${clean_env}" python -c \
            'import pypgo._core; print(pypgo._core.__file__)')"
          python tests/check_macos_accelerate_linkage.py "${installed_core}"
          tmpdir="$(mktemp -d)"
          cd "${tmpdir}"
          conda run -p "${clean_env}" python \
            "${GITHUB_WORKSPACE}/tests/check_installed_wheel.py"
          conda run -p "${clean_env}" python \
            "${GITHUB_WORKSPACE}/tests/conda_smoke_test.py"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: pypgo-wheel-macos-accelerate
          path: wheelhouse/pypgo-*.whl
          if-no-files-found: error
