name: macOS CI

on:
  push:
    branches:
      - main
      - master
      - original/*
      - codex/*
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-build-and-test:
    name: Python Build and Test (${{ matrix.label }})
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: openblas
            label: OpenBLAS
            environment_file: environment.yml
            conda_env: libpgo
            cmake_preset: pypgo-conda
            cmake_parallel: "3"

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          environment-file: ${{ matrix.environment_file }}
          activate-environment: ${{ matrix.conda_env }}
          auto-activate-base: false
          channels: conda-forge
          channel-priority: strict

      - name: Build Python wheel
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.cmake_parallel }}
          # Build the wheel with the preset that ships as a conda package (native
          # opt off) instead of the default `pypgo` preset (-march=native).
          PYPGO_CMAKE_PRESET: ${{ matrix.cmake_preset }}
        run: |
          rm -rf dist
          python -m pip wheel . --no-build-isolation --no-deps --wheel-dir dist
          wheel=(dist/pypgo-*.whl)
          if (( ${#wheel[@]} != 1 )); then
            printf 'Expected exactly one pypgo wheel, found %s.\n' "${#wheel[@]}"
            printf '%s\n' "${wheel[@]}"
            exit 1
          fi

      - name: Upload Python wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: pypgo-wheel-macos-${{ matrix.variant }}
          path: dist/pypgo-*.whl
          if-no-files-found: error

      - name: Verify wheel in clean conda environment
        run: |
          clean_env="${RUNNER_TEMP}/pypgo-wheel-${{ matrix.variant }}"
          conda create -y -p "${clean_env}" --clone "${CONDA_PREFIX}"
          conda run -p "${clean_env}" python -m pip install --no-index --find-links "${GITHUB_WORKSPACE}/dist" pypgo
          tmpdir="$(mktemp -d)"
          cd "${tmpdir}"
          conda run -p "${clean_env}" python - <<'PY'
          from pathlib import Path
          import os

          import pypgo
          import pypgo._core as core
          import pypgo.energy
          import pypgo.mesh
          import pypgo.solver

          package_file = Path(pypgo.__file__).resolve()
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          assert workspace not in package_file.parents, package_file
          info = core.build_info()
          assert info["module"] == "pypgo._core"
          print(f"pypgo wheel import OK from {package_file}")
          PY

  cmake-build:
    name: CMake Preset Build and Test
    runs-on: macos-15
    timeout-minutes: 120

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: libpgo
          auto-activate-base: false
          channels: conda-forge
          channel-priority: strict

      - name: Configure with preset base
        run: cmake --preset base

      - name: Build with preset base
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 3
        run: cmake --build --preset base

      - name: Run CTest
        run: ctest --test-dir build/base --output-on-failure

      - name: Free native build intermediates
        run: rm -rf build/base

      - name: Install Python test dependencies
        run: python -m pip install --no-cache-dir pytest pytest-timeout pyvista trame trame-vtk trame-vuetify torch

      - name: Run Python API pytest suite
        env:
          PYVISTA_OFF_SCREEN: "True"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          while IFS= read -r -d '' test_file; do
            if [[ "$(basename "${test_file}")" == test_notebook.py ]]; then
              continue
            fi
            python -m pytest -q "${test_file}"
          done < <(find tests/pypgo -maxdepth 1 -name 'test_*.py' -print0 | sort -z)
