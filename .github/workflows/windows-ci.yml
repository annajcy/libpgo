name: Windows CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MKL_THREADING_LAYER: TBB
  PYPGO_WHEEL_DIST: pypgo

jobs:
  build-test-wheel:
    name: Windows - Build, Test, and Package
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: libpgo
          auto-activate-base: false
          channels: conda-forge
          channel-priority: strict

      - name: Select the MSVC toolchain
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object {
            $_ -notmatch 'mingw' -and $_ -notmatch 'Strawberry'
          }) -join ';'
          "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install and verify MKL-TBB
        run: |
          conda install -y "libblas=*=*mkl" "liblapack=*=*mkl" mkl-devel
          python tests/check_mkl_tbb_runtime.py

      - name: Configure and build
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "3"
        run: |
          cmake --preset base-ci -G Ninja
          cmake --build --preset base-ci

      - name: Run native tests
        run: ctest --test-dir build/base-ci --output-on-failure

      - name: Install Python test dependencies
        run: |
          python -m pip install --no-cache-dir pytest pytest-timeout pyvista trame trame-vtk trame-vuetify
          python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu

      - name: Generate Python test volume assets
        shell: pwsh
        run: |
          python examples/assets/generate_veg_assets.py `
            --assets box `
            --cubic-resolution 4 `
            --tet-backend tetgen `
            --tet-target-elements 100 `
            --static-dragon-target-elements 0

      - name: Run Python API tests
        env:
          PYVISTA_OFF_SCREEN: "True"
        run: >-
          python -m pytest -q tests/pypgo
          --ignore=tests/pypgo/test_example_notebooks.py
          --ignore=tests/pypgo/test_notebook.py

      - name: Build wheel from the tested build tree
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "3"
          PYPGO_CMAKE_PRESET: base-ci
        run: |
          Remove-Item -Path dist -Recurse -Force -ErrorAction SilentlyContinue
          python -m pip wheel . --no-build-isolation --no-deps --wheel-dir dist

      - name: Repair and audit wheel
        run: |
          python -m pip install delvewheel
          Remove-Item -Path wheelhouse -Recurse -Force -ErrorAction SilentlyContinue

          $buildRoot = Join-Path $env:GITHUB_WORKSPACE "build\base-ci"
          $buildDllDirs = @(Get-ChildItem -Path $buildRoot -Recurse -Filter '*.dll' |
            ForEach-Object { $_.DirectoryName } | Sort-Object -Unique)
          if ($buildDllDirs.Count -gt 0) {
            $env:PATH = (($buildDllDirs + @($env:PATH)) -join ';')
          }

          $rawWheel = @(Get-ChildItem -Path dist -Filter "$env:PYPGO_WHEEL_DIST-*.whl")
          if ($rawWheel.Count -ne 1) {
            throw "Expected one raw wheel, found $($rawWheel.Count)."
          }

          $excludedDlls = @("libblas.dll", "blas.dll", "liblapack.dll", "lapack.dll")
          foreach ($stem in @("mkl_rt", "mkl_core", "mkl_intel_lp64", "mkl_intel_thread", "mkl_tbb_thread", "mkl_sequential")) {
            foreach ($suffix in @("", ".2", ".3")) {
              $excludedDlls += "$stem$suffix.dll"
            }
          }
          $excludeArgs = @()
          foreach ($dll in $excludedDlls) {
            $excludeArgs += @("--exclude", $dll)
          }
          python -m delvewheel repair @excludeArgs --wheel-dir wheelhouse $rawWheel[0].FullName

          $wheel = @(Get-ChildItem -Path wheelhouse -Filter "$env:PYPGO_WHEEL_DIST-*.whl")
          if ($wheel.Count -ne 1) {
            throw "Expected one repaired wheel, found $($wheel.Count)."
          }
          python -m delvewheel show $wheel[0].FullName
          python tests/check_wheel_vendoring.py --provider mkl $wheel[0].FullName

      - name: Verify wheel in a clean environment
        run: |
          $cleanEnv = Join-Path $env:RUNNER_TEMP "pypgo-wheel-mkl"
          $wheel = @(Get-ChildItem -Path wheelhouse -Filter "$env:PYPGO_WHEEL_DIST-*.whl")
          conda create -y -p $cleanEnv -c conda-forge --strict-channel-priority `
            python=3.12 pip numpy "libblas=*=*mkl" "liblapack=*=*mkl" mkl-devel
          conda run -p $cleanEnv python -m pip install --no-deps $wheel[0].FullName
          conda run -p $cleanEnv python `
            "$env:GITHUB_WORKSPACE\tests\check_mkl_tbb_runtime.py" --import-pypgo

          $workDir = Join-Path $env:RUNNER_TEMP "pypgo-wheel-import"
          New-Item -ItemType Directory -Path $workDir -Force | Out-Null
          Push-Location $workDir
          conda run -p $cleanEnv python `
            "$env:GITHUB_WORKSPACE\tests\check_installed_wheel.py"
          conda run -p $cleanEnv python `
            "$env:GITHUB_WORKSPACE\tests\conda_smoke_test.py"
          Pop-Location

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: pypgo-wheel-windows-mkl
          path: wheelhouse/pypgo-*.whl
          if-no-files-found: error
