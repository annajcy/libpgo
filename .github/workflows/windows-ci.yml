name: Windows CI

on:
  push:
    branches:
      - main
      - master
      - original/*
      - codex/*
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-build-and-test:
    name: Python Build and Test
    runs-on: windows-2022
    timeout-minutes: 120

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: libpgo
          auto-activate-base: false
          channels: conda-forge
          channel-priority: strict

      - name: Remove incompatible Fortran tools from PATH
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object {
            $_ -notmatch 'mingw' -and $_ -notmatch 'Strawberry'
          }) -join ';'
          "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Free up disk space and show resources
        run: |
          function Show-Resources($label) {
            Write-Host "=== $label ==="
            Get-PSDrive C | Select-Object @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}}, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} | Format-Table -AutoSize
            Get-CimInstance Win32_OperatingSystem | Select-Object @{n='FreeMemMB';e={[math]::Round($_.FreePhysicalMemory/1KB)}}, @{n='TotalMemMB';e={[math]::Round($_.TotalVisibleMemorySize/1KB)}} | Format-Table -AutoSize
          }
          Show-Resources "before cleanup"
          # Android SDK (~10 GB) is unused here; removing it gives the heavy native
          # build headroom on the ~14 GB C: drive.
          Remove-Item -Path "C:\Android" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "${env:ProgramFiles(x86)}\Android" -Recurse -Force -ErrorAction SilentlyContinue
          Show-Resources "after cleanup"

      - name: Build and install Python package
        env:
          # Cap concurrent compiles (setup.py honors this): the default cpu_count()
          # (4) plus the torch/viz install exhausts the hosted runner mid-build.
          # Mirrors the cmake-build job's level.
          CMAKE_BUILD_PARALLEL_LEVEL: "3"
        run: python -m pip install -e .[viz,torch,dev] --no-build-isolation

      - name: Run Python API pytest suite
        run: python -m pytest -q tests/pypgo

      - name: Execute example notebooks
        run: $env:PYVISTA_OFF_SCREEN='True'; $env:RUN_NOTEBOOKS='1'; python -m pytest tests/pypgo/test_notebook.py -v -k "TestNotebookExecution"

  cmake-build:
    name: CMake Preset Build and Test (MKL)
    runs-on: windows-2022
    timeout-minutes: 120

    defaults:
      run:
        shell: pwsh

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          environment-file: environment-mkl.yml
          activate-environment: libpgo-mkl
          auto-activate-base: false
          channels: conda-forge
          channel-priority: strict

      - name: Remove incompatible Fortran tools from PATH
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object {
            $_ -notmatch 'mingw' -and $_ -notmatch 'Strawberry'
          }) -join ';'
          "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure with preset base
        run: cmake --preset base -G Ninja

      - name: Build with preset base
        run: cmake --build --preset base

      - name: Run CTest
        run: ctest --test-dir build/base --output-on-failure
