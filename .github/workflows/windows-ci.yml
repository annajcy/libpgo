name: Windows CI

on:
  push:
    branches:
      - main
      - master
      - original/*
      - codex/*
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-build-and-test:
    name: Python Build and Test (${{ matrix.label }})
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - variant: openblas
            label: OpenBLAS
            environment_file: environment.yml
            conda_env: libpgo
            cmake_preset: pypgo-ci
            cmake_parallel: "3"
            wheel_package: pypgo
            wheel_dist: pypgo
          - variant: mkl
            label: MKL
            environment_file: environment-mkl.yml
            conda_env: libpgo-mkl
            cmake_preset: pypgo-mkl-ci
            cmake_parallel: "3"
            wheel_package: pypgo-mkl
            wheel_dist: pypgo_mkl

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          environment-file: ${{ matrix.environment_file }}
          activate-environment: ${{ matrix.conda_env }}
          auto-activate-base: false
          channels: conda-forge
          channel-priority: strict

      - name: Select pthreads OpenBLAS for PyPI wheel
        if: matrix.wheel_package == 'pypgo'
        run: |
          conda install -y `
            "libblas=*=*openblas" `
            "liblapack=*=*openblas" `
            "openblas=*=*pthreads*" `
            "libopenblas=*=*pthreads*"

      - name: Remove incompatible Fortran tools from PATH
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object {
            $_ -notmatch 'mingw' -and $_ -notmatch 'Strawberry'
          }) -join ';'
          "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Free up disk space and show resources
        run: |
          function Show-Resources($label) {
            Write-Host "=== $label ==="
            Get-PSDrive C | Select-Object @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}}, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} | Format-Table -AutoSize
            Get-CimInstance Win32_OperatingSystem | Select-Object @{n='FreeMemMB';e={[math]::Round($_.FreePhysicalMemory/1KB)}}, @{n='TotalMemMB';e={[math]::Round($_.TotalVisibleMemorySize/1KB)}} | Format-Table -AutoSize
          }
          Show-Resources "before cleanup"
          # Android SDK (~10 GB) is unused here; removing it gives the heavy native
          # build headroom on the ~14 GB C: drive.
          Remove-Item -Path "C:\Android" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "${env:ProgramFiles(x86)}\Android" -Recurse -Force -ErrorAction SilentlyContinue
          Show-Resources "after cleanup"

      - name: Build Python wheel
        env:
          # Cap concurrent compiles (setup.py honors this): the default cpu_count()
          # (4) can exhaust the hosted runner mid native build. Mirrors the
          # cmake-build job's level.
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.cmake_parallel }}
          # Build the wheel with the preset that ships as a conda package (native
          # opt off) instead of the default `pypgo` preset.
          PYPGO_CMAKE_PRESET: ${{ matrix.cmake_preset }}
          PYPGO_PACKAGE_NAME: ${{ matrix.wheel_package }}
          PYPGO_WHEEL_DIST: ${{ matrix.wheel_dist }}
        run: |
          Remove-Item -Path dist -Recurse -Force -ErrorAction SilentlyContinue
          python -m pip wheel . --no-build-isolation --no-deps --wheel-dir dist
          $wheels = @(Get-ChildItem -Path dist -Filter "$env:PYPGO_WHEEL_DIST-*.whl")
          if ($wheels.Count -ne 1) {
            $wheelList = ($wheels | ForEach-Object { $_.FullName }) -join "`n"
            throw "Expected exactly one $env:PYPGO_WHEEL_DIST wheel, found $($wheels.Count).`n$wheelList"
          }

      - name: Repair Python wheel
        env:
          PYPGO_CMAKE_PRESET: ${{ matrix.cmake_preset }}
          PYPGO_WHEEL_PACKAGE: ${{ matrix.wheel_package }}
          PYPGO_WHEEL_DIST: ${{ matrix.wheel_dist }}
        run: |
          python -m pip install delvewheel
          Remove-Item -Path wheelhouse -Recurse -Force -ErrorAction SilentlyContinue

          $buildRoot = Join-Path $env:GITHUB_WORKSPACE "build\$env:PYPGO_CMAKE_PRESET"
          $buildDllDirs = @()
          if (Test-Path $buildRoot) {
            $buildDllDirs = @(Get-ChildItem -Path $buildRoot -Recurse -Filter '*.dll' |
              ForEach-Object { $_.DirectoryName } |
              Sort-Object -Unique)
          }
          if ($buildDllDirs.Count -gt 0) {
            $env:PATH = (($buildDllDirs + @($env:PATH)) -join ';')
            Write-Host "Added build DLL directories to PATH:"
            $buildDllDirs | ForEach-Object { Write-Host "  $_" }
          }

          $rawWheels = @(Get-ChildItem -Path dist -Filter "$env:PYPGO_WHEEL_DIST-*.whl")
          if ($rawWheels.Count -ne 1) {
            $wheelList = ($rawWheels | ForEach-Object { $_.FullName }) -join "`n"
            throw "Expected exactly one raw $env:PYPGO_WHEEL_DIST wheel, found $($rawWheels.Count).`n$wheelList"
          }
          $excludeArgs = @()
          if ($env:PYPGO_WHEEL_PACKAGE -eq "pypgo-mkl") {
            $excludedDlls = @(
              "libopenblas.dll",
              "openblas.dll",
              "libblas.dll",
              "blas.dll",
              "liblapack.dll",
              "lapack.dll",
              "mkl_rt.dll",
              "mkl_rt.2.dll",
              "mkl_core.dll",
              "mkl_core.2.dll",
              "mkl_intel_lp64.dll",
              "mkl_intel_lp64.2.dll",
              "mkl_intel_thread.dll",
              "mkl_intel_thread.2.dll",
              "mkl_tbb_thread.dll",
              "mkl_tbb_thread.2.dll",
              "mkl_sequential.dll",
              "mkl_sequential.2.dll",
              "libiomp5md.dll",
              "libomp.dll",
              "vcomp140.dll"
            )
            foreach ($dll in $excludedDlls) {
              $excludeArgs += @("--exclude", $dll)
            }
          }
          python -m delvewheel repair @excludeArgs --wheel-dir wheelhouse $rawWheels[0].FullName

          $wheels = @(Get-ChildItem -Path wheelhouse -Filter "$env:PYPGO_WHEEL_DIST-*.whl")
          if ($wheels.Count -ne 1) {
            $wheelList = ($wheels | ForEach-Object { $_.FullName }) -join "`n"
            throw "Expected exactly one repaired $env:PYPGO_WHEEL_DIST wheel, found $($wheels.Count).`n$wheelList"
          }
          python -m delvewheel show $wheels[0].FullName
          @'
          import sys
          import zipfile

          wheel_package = sys.argv[2]
          with zipfile.ZipFile(sys.argv[1]) as archive:
              names = [name.lower() for name in archive.namelist() if ".libs/" in name]
          if wheel_package == "pypgo-mkl":
              forbidden = (
                  "openblas",
                  "libblas",
                  "blas.dll",
                  "liblapack",
                  "lapack.dll",
                  "mkl_",
                  "libiomp",
                  "libomp",
                  "vcomp",
              )
              vendored = [
                  name
                  for name in names
                  if any(token in name for token in forbidden)
              ]
              if vendored:
                  print("Repaired pypgo-mkl wheel unexpectedly vendors BLAS/MKL/OpenMP runtime libraries:")
                  for name in vendored:
                      print(f"  {name}")
                  raise SystemExit(1)
              print("OK: pypgo-mkl wheel relies on the conda-provided BLAS/MKL/OpenMP runtime.")
          else:
              openblas = [name for name in names if "openblas" in name]
              if not openblas:
                  print("Repaired pypgo wheel did not vendor OpenBLAS:")
                  for name in names:
                      print(f"  {name}")
                  raise SystemExit(1)
              print("OK: pypgo wheel vendors an OpenBLAS runtime.")
          '@ | python - $wheels[0].FullName $env:PYPGO_WHEEL_PACKAGE

      - name: Upload Python wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: pypgo-wheel-windows-${{ matrix.variant }}
          path: wheelhouse/${{ matrix.wheel_dist }}-*.whl
          if-no-files-found: error

      - name: Verify repaired wheel in minimal environment
        env:
          PYPGO_WHEEL_DIST: ${{ matrix.wheel_dist }}
          PYPGO_WHEEL_PACKAGE: ${{ matrix.wheel_package }}
        run: |
          $cleanEnv = Join-Path $env:RUNNER_TEMP "pypgo-wheel-${{ matrix.variant }}"
          $wheel = @(Get-ChildItem -Path "$env:GITHUB_WORKSPACE\wheelhouse" -Filter "$env:PYPGO_WHEEL_DIST-*.whl")
          if ($wheel.Count -ne 1) {
            $wheelList = ($wheel | ForEach-Object { $_.FullName }) -join "`n"
            throw "Expected exactly one repaired $env:PYPGO_WHEEL_DIST wheel, found $($wheel.Count).`n$wheelList"
          }
          if ($env:PYPGO_WHEEL_PACKAGE -eq "pypgo-mkl") {
            conda create -y -p $cleanEnv python=3.12 pip numpy "libblas=*=*mkl" "liblapack=*=*mkl" mkl-devel
            conda run -p $cleanEnv python -m pip install --no-deps $wheel[0].FullName
          } else {
            python -m venv $cleanEnv
            $python = Join-Path $cleanEnv "Scripts\python.exe"
            & $python -m pip install --upgrade pip
            & $python -m pip install $wheel[0].FullName
          }

          $script = Join-Path $env:RUNNER_TEMP "verify-pypgo-wheel-${{ matrix.variant }}.py"
          @'
          from pathlib import Path
          import os

          import pypgo
          import pypgo._core as core
          import pypgo.energy
          import pypgo.mesh
          import pypgo.solver

          package_file = Path(pypgo.__file__).resolve()
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          assert workspace not in package_file.parents, package_file
          info = core.build_info()
          assert info["module"] == "pypgo._core"
          print(f"pypgo wheel import OK from {package_file}")
          '@ | Set-Content -Path $script -Encoding utf8

          $workDir = Join-Path $env:RUNNER_TEMP "pypgo-wheel-import-${{ matrix.variant }}"
          New-Item -ItemType Directory -Path $workDir -Force | Out-Null
          Push-Location $workDir
          if ($env:PYPGO_WHEEL_PACKAGE -eq "pypgo-mkl") {
            conda run -p $cleanEnv python $script
            conda run -p $cleanEnv python "$env:GITHUB_WORKSPACE\tests\conda_smoke_test.py"
          } else {
            & $python $script
            & $python "$env:GITHUB_WORKSPACE\tests\conda_smoke_test.py"
          }
          Pop-Location

  cmake-build:
    name: CMake Preset Build and Test (${{ matrix.label }})
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - label: OpenBLAS
            environment_file: environment.yml
            conda_env: libpgo
            cmake_parallel: "3"
            cmake_configure_args: -DPGO_USE_MKL=OFF
          - label: MKL
            environment_file: environment-mkl.yml
            conda_env: libpgo-mkl
            cmake_parallel: "3"
            cmake_configure_args: ""

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          environment-file: ${{ matrix.environment_file }}
          activate-environment: ${{ matrix.conda_env }}
          auto-activate-base: false
          channels: conda-forge
          channel-priority: strict

      - name: Remove incompatible Fortran tools from PATH
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object {
            $_ -notmatch 'mingw' -and $_ -notmatch 'Strawberry'
          }) -join ';'
          "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Free up disk space and show resources
        run: |
          function Show-Resources($label) {
            Write-Host "=== $label ==="
            Get-PSDrive C | Select-Object @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}}, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} | Format-Table -AutoSize
            Get-CimInstance Win32_OperatingSystem | Select-Object @{n='FreeMemMB';e={[math]::Round($_.FreePhysicalMemory/1KB)}}, @{n='TotalMemMB';e={[math]::Round($_.TotalVisibleMemorySize/1KB)}} | Format-Table -AutoSize
          }
          Show-Resources "before cleanup"
          # Android SDK (~10 GB) is unused here; removing it gives the heavy native
          # build and Python test dependencies headroom on the ~14 GB C: drive.
          Remove-Item -Path "C:\Android" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "${env:ProgramFiles(x86)}\Android" -Recurse -Force -ErrorAction SilentlyContinue
          Show-Resources "after cleanup"

      - name: Configure with preset base
        run: cmake --preset base -G Ninja ${{ matrix.cmake_configure_args }}

      - name: Build with preset base
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.cmake_parallel }}
        run: cmake --build --preset base

      - name: Run CTest
        run: ctest --test-dir build/base --output-on-failure

      - name: Install Python test dependencies
        run: |
          python -m pip install --no-cache-dir pytest pytest-timeout pyvista trame trame-vtk trame-vuetify
          python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run Python API pytest suite
        env:
          PYVISTA_OFF_SCREEN: "True"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          Get-ChildItem -Path tests\pypgo -Filter 'test_*.py' |
            Sort-Object Name |
            Where-Object { $_.Name -notin @('test_example_notebooks.py', 'test_notebook.py') } |
            ForEach-Object {
              python -m pytest -q $_.FullName
              if ($LASTEXITCODE -ne 0) {
                exit $LASTEXITCODE
              }
            }
