name: Python Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python -c "import os, pathlib, re, sys; text = pathlib.Path('setup.py').read_text(); match = re.search(r'version=\"([^\"]+)\"', text); version = match.group(1) if match else None; tag = os.environ['GITHUB_REF_NAME'].removeprefix('v'); sys.exit(0 if version == tag else f'tag {tag!r} does not match setup.py version {version!r}')"

      - name: Build source distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --sdist
          python -m twine check dist/*

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: pypgo-sdist
          path: dist/*
          if-no-files-found: error

  build-wheels:
    name: Build wheel (${{ matrix.label }})
    needs: build-sdist
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-24.04
            cibw-build: cp312-manylinux_x86_64
          - label: macos-x86_64
            os: macos-15-intel
            cibw-build: cp312-macosx_x86_64
          - label: macos-arm64
            os: macos-15
            cibw-build: cp312-macosx_arm64
          - label: windows-amd64
            os: windows-2022
            cibw-build: cp312-win_amd64

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 3
      CIBW_BUILD: ${{ matrix.cibw-build }}
      CIBW_BUILD_VERBOSITY: 1
      CIBW_ENVIRONMENT: PYPGO_CMAKE_PRESET=pypgo-wheel
      CIBW_ENVIRONMENT_LINUX: >
        PYPGO_CMAKE_PRESET=pypgo-wheel
        CONDA_PREFIX=/opt/pypgo-wheel-deps
        CMAKE_PREFIX_PATH=/opt/pypgo-wheel-deps
        LD_LIBRARY_PATH=/opt/pypgo-wheel-deps/lib:$LD_LIBRARY_PATH
        PKG_CONFIG_PATH=/opt/pypgo-wheel-deps/lib/pkgconfig:/opt/pypgo-wheel-deps/share/pkgconfig:$PKG_CONFIG_PATH
      CIBW_ENVIRONMENT_MACOS: >
        PYPGO_CMAKE_PRESET=pypgo-wheel
        CONDA_PREFIX="$PYPGO_CONDA_PREFIX"
        CMAKE_PREFIX_PATH="$PYPGO_CONDA_PREFIX"
        DYLD_LIBRARY_PATH="$PYPGO_CONDA_PREFIX/lib:$DYLD_LIBRARY_PATH"
        PKG_CONFIG_PATH="$PYPGO_CONDA_PREFIX/lib/pkgconfig:$PYPGO_CONDA_PREFIX/share/pkgconfig:$PKG_CONFIG_PATH"
      CIBW_ENVIRONMENT_WINDOWS: >
        PYPGO_CMAKE_PRESET=pypgo-wheel
        CONDA_PREFIX="$PYPGO_CONDA_PREFIX"
        CMAKE_PREFIX_PATH="$PYPGO_CONDA_PREFIX"
      CIBW_BEFORE_ALL_LINUX: >
        curl -L https://micro.mamba.pm/api/micromamba/linux-64/latest |
        tar -xvj -C /usr/local/bin --strip-components=1 bin/micromamba &&
        micromamba create -y -p /opt/pypgo-wheel-deps -f {package}/.github/conda/pypgo-wheel.yml &&
        micromamba clean -a -y
      CIBW_BEFORE_BUILD_WINDOWS: python -m pip install delvewheel
      CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
        LD_LIBRARY_PATH=/opt/pypgo-wheel-deps/lib:$LD_LIBRARY_PATH
        auditwheel repair -w {dest_dir} {wheel}
      CIBW_REPAIR_WHEEL_COMMAND_MACOS: >
        DYLD_LIBRARY_PATH="$PYPGO_CONDA_PREFIX/lib:$DYLD_LIBRARY_PATH"
        delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}
      CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >
        delvewheel repair --add-path "%PYPGO_CONDA_PREFIX%\Library\bin" -w {dest_dir} {wheel}
      CIBW_TEST_COMMAND: python -c "import pypgo._core as core; print(core.build_info())"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Miniforge
        if: runner.os != 'Linux'
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          environment-file: .github/conda/pypgo-wheel.yml
          activate-environment: pypgo-wheel
          auto-activate-base: false
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: true

      - name: Capture conda prefix
        if: runner.os == 'macOS'
        shell: bash -el {0}
        run: echo "PYPGO_CONDA_PREFIX=$CONDA_PREFIX" >> "$GITHUB_ENV"

      - name: Capture conda prefix
        if: runner.os == 'Windows'
        run: '"PYPGO_CONDA_PREFIX=$env:CONDA_PREFIX" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'

      - name: Remove incompatible Fortran tools from PATH
        if: runner.os == 'Windows'
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object {
            $_ -notmatch 'mingw' -and $_ -notmatch 'Strawberry'
          }) -join ';'
          "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and repair wheel
        uses: pypa/cibuildwheel@v3.4.1

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: pypgo-wheel-${{ matrix.label }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-sdist
      - build-wheels
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List distributions
        run: ls -lh dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
